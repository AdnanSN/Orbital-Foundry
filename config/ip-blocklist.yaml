# Words and names that must not appear in a design, its prompt or its listing copy.
# ip_screen blocks a match outright; the model screen catches what a list cannot.
# Matching ignores case and needs whole words ("marvel" does not match "marvellous").
#
# Only list terms that are (almost) never generic. Everyday words that are also trademarks
# (apple, frozen, friends, peanuts, amazon, supreme) would block honest designs like an "apple
# cinnamon candle"; the model screen judges those in context instead.
# This list is a starting point, not legal advice. Add to it whenever a review finds a miss.

