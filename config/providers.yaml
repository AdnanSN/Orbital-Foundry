# Orbital Foundry model providers.
#
# Each provider speaks the OpenAI chat-completions API at `baseURL`.
# `lanes` is the important part (docs/DECISIONS.md, D-001):
#   sandbox  development, tests, demos. Outputs are never sold or delivered.
#   live     anything that reaches customers or marketplaces. Only add "live" when the
#            provider's terms allow production use, and record the check in DECISIONS.md.
# Config validation and the router both refuse live traffic to a provider without "live".
# `limits` are our own budgets; keep them a little under each provider's real caps.

providers:
  nvidia:
    name: NVIDIA NIM (build.nvidia.com free trial)
    baseURL: https://integrate.api.nvidia.com/v1
    apiKeyEnv: NVIDIA_API_KEY
    lanes: [sandbox]
    production: forbidden # trial terms: no production use, outputs may not be sold
    termsChecked: 2026-11-04
    limits: { rpm: 35, concurrency: 4 }
    publicModelList: true
    quirks: { embedInputType: true }
    terms: >-
      Trial terms (checked 2026-11-04): testing and evaluation only; no production use of the
      service or its Generated Content, and Generated Content may not be sold or distributed.

  cloudflare:
    name: Cloudflare Workers AI
    baseURL: https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/ai/v1
    apiKeyEnv: CLOUDFLARE_API_TOKEN
    lanes: [sandbox, live]
    production: allowed # re-checked 2026-11-05 before the first sale (D-045)
    termsChecked: 2026-11-05
    # The real free budget is 10,000 neurons/day (≈170 FLUX.1-schnell images); these just cap bursts.
    limits: { rpm: 120, rpd: 2000, concurrency: 4 }
    terms: >-
      Free allocation of 10,000 neurons/day on the normal Workers plans, resetting 00:00 UTC. Not a
      trial. Service-Specific Terms, Developer Platform (updated 2026-09-28, checked 2026-11-05): no
      limit on commercial or production use; the customer is responsible for outputs and follows
      each model's licence and acceptable use policy; Cloudflare does not train on customer
      content. FLUX.1-schnell and Mistral Small 3.1 are Apache-2.0; Llama models carry Meta's
      community licences.

  groq:
    name: Groq
    baseURL: https://api.groq.com/openai/v1
    apiKeyEnv: GROQ_API_KEY
    lanes: [sandbox, live] # live: Groq's "production" models only, never "preview" ones (D-045)
    production: allowed
    termsChecked: 2026-11-05
    # Free plan (checked 2026-11-05): per model 30 rpm, 1K requests and 200K tokens a day, 8K
    # tokens a minute. The token cap keeps bursts under the per-minute limit.
    limits: { rpm: 25, rpd: 2500, concurrency: 2, maxTokens: 1500 }
    terms: >-
      Groq Services Agreement (updated 2026-06-22, checked 2026-11-05): it covers fee-free use; the
      customer keeps all rights in inputs and outputs; Groq may not train on them; each hosted
      model's own terms apply. Groq's model list says preview models "are intended for evaluation
      purposes only", so only production models go in the live lane.

  openrouter:
    name: OpenRouter (":free" models)
    baseURL: https://openrouter.ai/api/v1
    apiKeyEnv: OPENROUTER_API_KEY
    lanes: [sandbox] # upstream terms vary per model, and some free endpoints log prompts
    production: unverified
    limits: { rpm: 15, rpd: 45, concurrency: 2 }
    publicModelList: true

  gemini:
    name: Google Gemini API (free quota)
    baseURL: https://generativelanguage.googleapis.com/v1beta/openai
    apiKeyEnv: GEMINI_API_KEY
    lanes: [sandbox] # free-tier prompts and outputs are used to improve Google products
    production: unverified
    limits: { rpm: 8, rpd: 200, concurrency: 2 }

  cerebras:
    name: Cerebras
    baseURL: https://api.cerebras.ai/v1
    apiKeyEnv: CEREBRAS_API_KEY
    lanes: [sandbox]
    limits: { rpm: 25, rpd: 900, concurrency: 2 }

  # FreeLLMAPI: a local pool of ~34 free tiers behind one key (infra/freellmapi, D-044). It picks
  # the upstream per request and fails over on 429/5xx; the upstream lands in llm_calls.routed_via.
  freellm:
    name: FreeLLMAPI (local pool of free tiers)
    baseURL: http://127.0.0.1:3001/v1
    apiKeyEnv: FREELLM_API_KEY
    lanes: [sandbox] # never live: which upstream answers is decided per request
    production: forbidden
    termsChecked: 2026-11-05
    # Our own ceiling; the pool also tracks each upstream key's limits itself.
    limits: { rpm: 40, concurrency: 4 }
    terms: >-
      FreeLLMAPI's README (checked 2026-11-05): "for personal experimentation and learning, not
      production"; each upstream provider's own terms still apply, and some free upstreams log
      prompts for research. Sandbox only: drafts, planning and tests, never anything sold.

images:
  nvidia-flux-schnell:
    provider: nvidia
    kind: nvidia-genai
    url: https://ai.api.nvidia.com/v1/genai/black-forest-labs/flux.1-schnell
    lanes: [sandbox]
    license: Apache-2.0 model; NVIDIA trial terms apply to outputs, so never sell them
    maxSteps: 4
    supportsSize: true
    pollSeconds: 30 # answer 202 + request id instead of hanging

  cloudflare-flux-schnell:
    provider: cloudflare
    kind: cloudflare-run
    url: https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/ai/run/@cf/black-forest-labs/flux-1-schnell
    lanes: [sandbox, live]
    license: Apache-2.0
    maxSteps: 8
    supportsSize: false # always 1024x1024
    supportsSeed: false # its input schema rejects a seed
